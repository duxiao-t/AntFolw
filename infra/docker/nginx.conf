server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 136m;

    # 安全响应头。注意 nginx 的语义：**只要某个 location 里出现了自己的 add_header，
    # 它就不再继承 server 级的 add_header**——所以下面每个带 add_header 的 location 都要重复一份。
    # 改这里时请同步改：本处 + location ~* /index\.html$ + location ^~ /mobile/assets/。
    # CSP 暂不启用：桌面端(Umi)与移动端(Vite)都有内联样式/运行时写法，直接上会白屏；
    # 要上须单独评估并先在 Report-Only 模式观察。frame-ancestors 的先由 X-Frame-Options 兜住。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 明文 HTTP 下浏览器会忽略 HSTS；配置 HTTPS 后自动生效，无需再改。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 所有 index.html 都不缓存：深链接（如 /account/settings）命中的是 location / 的 fallback
    # 或各路由目录下的 index.html，若不带 no-cache，浏览器会沿用旧 HTML → 指向旧的 hashed JS
    # → 部署后仍看到旧页面。hashed 资源仍按各自规则缓存。
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ^~ /mobile/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location ~ ^/api/(mobile|workflow)/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而不是追加：$proxy_add_x_forwarded_for 会把客户端自带的头留在最左，而
        # Spring 的 forward-headers-strategy=framework 取「最左」值当 remoteAddr →
        # 伪造 X-Forwarded-For 即可绕过登录限流、污染审计 client_ip。
        # 若本机 nginx 前面还有一层 LB/CDN，请改用 set_real_ip_from + real_ip_header
        # 让 $remote_addr 反映真实客户端，不要改回追加语义。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而不是追加：$proxy_add_x_forwarded_for 会把客户端自带的头留在最左，而
        # Spring 的 forward-headers-strategy=framework 取「最左」值当 remoteAddr →
        # 伪造 X-Forwarded-For 即可绕过登录限流、污染审计 client_ip。
        # 若本机 nginx 前面还有一层 LB/CDN，请改用 set_real_ip_from + real_ip_header
        # 让 $remote_addr 反映真实客户端，不要改回追加语义。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
