server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 136m;

    # 所有 index.html 都不缓存：深链接（如 /account/settings）命中的是 location / 的 fallback
    # 或各路由目录下的 index.html，若不带 no-cache，浏览器会沿用旧 HTML → 指向旧的 hashed JS
    # → 部署后仍看到旧页面。hashed 资源仍按各自规则缓存。
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /mobile/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location ~ ^/api/(mobile|workflow)/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
