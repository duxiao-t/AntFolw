server {
    listen 80;
    server_name antflow.example.com;

    root /usr/share/nginx/html;

    # 安全响应头。nginx 语义：某 location 一旦有自己的 add_header，就不再继承 server 级的，
    # 所以下面每个带 add_header 的 location 都要重复一份（改这里请四处同步）。
    # 预览是同源 iframe，用 DENY 会显示「<host> 拒绝了我们的连接请求」；SAMEORIGIN 仍拒绝跨源嵌套。
    # CSP 只下发 frame-ancestors（不要引入 default-src，SPA 内联样式会白屏）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 明文 HTTP 下浏览器忽略 HSTS；配上 HTTPS 后自动生效。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /mobile/index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ^~ /mobile/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ~ ^/mobile/(favicon\.svg|icons\.svg|manifest\.webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location ~ ^/api/(mobile|workflow)/events$ {
        proxy_pass http://antflow-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而不是追加：客户端自带的 X-Forwarded-For 若留在最左，会被 Spring 的
        # forward-headers-strategy=framework 当成 remoteAddr → 登录限流可绕过、审计 IP 失真。
        # 前面还有 LB/CDN 时用 set_real_ip_from + real_ip_header 修正 $remote_addr，不要改回追加。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://antflow-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
