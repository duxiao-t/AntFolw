name: antflow-local

services:
  backup-init:
    image: nginx:1.28-alpine
    command: ["sh", "-c", "mkdir -p /backups && chown 10001:10001 /backups && chmod 700 /backups"]
    volumes:
      - ${BACKUP_DIRECTORY:-/www/antflow/backups}:/backups

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 只映射到宿主机 25432：本机 5432 已被独立安装的 PostgreSQL 占用、15432 被 Docker 代理占用，
    # 直接映射 5432 会撞端口或让图形工具连错库。
    # 应用容器走 compose 内部网络（postgres:5432），不依赖这条映射；它只为 Navicat 等外部工具服务。
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: antflow
      POSTGRES_USER: antflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antflow -d antflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "7072:9000"
      - "7073:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antflow?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: antflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # 连接池没在 yml 里写死；要调就设 DB_POOL_MAX_SIZE（Spring 的 relaxed binding 直接认这个变量名）。
      # 默认 10 == Spring 默认值，公式与建议值见 docs/capacity-tuning-2026-09-30.md。
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD:?set ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD}
      # bob 是开发种子账号：不注入则会停在"待初始化"哨兵态（登不进去、也改不了密码），
      # 后端启动时会打印 WARN 点名。生产可不设。
      ANTFLOW_BOOTSTRAP_BOB_PASSWORD: ${ANTFLOW_BOOTSTRAP_BOB_PASSWORD:-}
      AUDIT_TRUSTED_PROXIES: ${AUDIT_TRUSTED_PROXIES:-172.16.0.0/12}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: antflow-local-mobile-files
      MINIO_CREATE_BUCKET: "true"
      AUDIT_ARCHIVE_ENDPOINT: http://minio:9000
      AUDIT_ARCHIVE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AUDIT_ARCHIVE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AUDIT_ARCHIVE_BUCKET: antflow-local-audit-archives
      AUDIT_ARCHIVE_CREATE_BUCKET: "true"
      AUDIT_ARCHIVE_ENCRYPTION_SECRET: ${AUDIT_ARCHIVE_ENCRYPTION_SECRET:?set AUDIT_ARCHIVE_ENCRYPTION_SECRET}
      AUDIT_ARCHIVE_KEY_ID: docker-local-v1
      ANTFLOW_INTEGRATION_ENCRYPTION_KEY: ${ANTFLOW_INTEGRATION_ENCRYPTION_KEY:?set ANTFLOW_INTEGRATION_ENCRYPTION_KEY}
      # 对外访问地址：OIDC 回跳、企业微信免登与「移动端应用主页」都用它拼链接。
      # 本机访问用默认值；局域网访问填 http://<ip>:7070；域名+HTTPS 填 https://<域名>。
      # 只要会从别的机器访问就必须改，否则那些跳转会指向 127.0.0.1 而失效（启动时会有 WARN）。
      ANTFLOW_PUBLIC_BASE_URL: ${ANTFLOW_PUBLIC_BASE_URL:-http://127.0.0.1:7070}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
      ANTFLOW_OIDC_ALLOWED_HOSTS: ${ANTFLOW_OIDC_ALLOWED_HOSTS:-}
      ANTFLOW_OIDC_HTTPS_ONLY: ${ANTFLOW_OIDC_HTTPS_ONLY:-true}
      BACKUP_DIRECTORY: /backups
      BACKUP_ENCRYPTION_SECRET: ${BACKUP_ENCRYPTION_SECRET:?set BACKUP_ENCRYPTION_SECRET}
      ANTFLOW_TIME_ZONE: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # 必须给**宿主机绝对路径**：Linux 用 /srv/antflow/backups 之类；
      # Docker Desktop（Windows/macOS）上留成 `/www/...` 会被当成 VM 内路径，
      # 落在那块约 200MB 的根盘上 → 备份写到一半 ENOSPC（实测踩过）。
      # 例如 Windows：BACKUP_DIRECTORY=D:/antflow-backups
      # 属主由 deploy.sh 的 ensure_backup_directory 每次部署兜一遍（10001:10001, 700）。
      - ${BACKUP_DIRECTORY:-/www/antflow/backups}:/backups
    # 健康检查是发布脚本回滚判据的一部分：没有它，web 会在 backend 还没 ready 时就开始接流量，
    # 部署脚本也只能靠一条外部 curl 判断成败（见 deploy.sh 的 wait_healthy / rollback）。
    # 依赖镜像里的 curl（Dockerfile.local 已装）。**升级时务必带 --build 重建 backend 镜像**，
    # 否则旧镜像没有 curl，healthcheck 永远不健康、web 会因 service_healthy 起不来。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: web
    restart: unless-stopped
    ports:
      - "7070:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
