name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 六个健康指标（docs/architecture-review-2026-10-09.md B4）：冻结实测基线，只禁止变差。
  # 纯 Node 内置模块，不需要装依赖，所以单独一个 job，几秒就跑完。
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Health metrics
        run: node scripts/health-metrics.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: antflow
          POSTGRES_USER: antflow
          POSTGRES_PASSWORD: antflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antflow -d antflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy script
        run: bash -n ../deploy.sh && bash ../deploy.sh --self-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 图片/视频水印要跑 ffmpeg（部署镜像里也装了）。不装的话 MediaWatermarkProcessorTest 里那两条
      # 真机用例会被 assumeTrue 静默跳过——"水印能跑"其实从来没在 CI 里验过。
      - name: Install ffmpeg for watermark tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-wqy-microhei
      - name: Run unit tests
        run: mvn -B test
        env:
          JWT_SECRET: ci-secret-0123456789-ci-secret-0123456789-ci
          ANTFLOW_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/antflow
          ANTFLOW_TEST_POSTGRES_USERNAME: antflow
          ANTFLOW_TEST_POSTGRES_PASSWORD: antflow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint (Biome)
        run: npm run biome:lint
      - name: Type-check
        run: npm run tsc
      # 生成的声明（src/services/antflow/typings.d.ts）平时被 tsconfig 的 skipLibCheck 跳过，
      # 只有"被引用处"受检查。这条单独用 skipLibCheck:false 检查它本身，范围只有该文件。
      - name: Type-check generated declarations
        run: npm run tsc:openapi
      # 导入边界：只拦新增（存量冻在 frontend/import-boundaries.baseline.json）。
      - name: Import boundaries
        run: npm run check:boundaries
      # 契约 client 必须能由提交的 config/antflow-api.json 重生成且逐字一致：
      # 新增（漏提交）/ 遗留（该删）/ 内容不一致 三个方向都红。
      - name: Contract client up to date
        run: npm run openapi:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bundle-budget
          path: mobile/test-results/bundle-budget.json
          if-no-files-found: ignore

  # 移动端 E2E 冒烟：全部是 route mock，不需要后端/数据库，也不用构建产物（webServer 起 vite）。
  # 只跑功能用例；视觉回归（key-pages/shell-visual）依赖字体渲染，Linux 与本地基线不一致，暂不进 CI。
  mobile-e2e:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: >-
          npx playwright test
          e2e/full-approval-flow.spec.ts
          e2e/rework-original-form.spec.ts
          e2e/draft-recovery.spec.ts
          e2e/permission-errors.spec.ts
          e2e/selection-popup-layout.spec.ts
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-traces
          path: mobile/test-results/
          if-no-files-found: ignore
