spring:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:Tao@1234}

antflow:
  auth:
    # 不给静态默认值：默认成公开口令等于把 V48 的整改抵消掉（初始化器现在也直接拒绝已知共享口令）。
    # 库里存在等待初始化的哨兵账号时，不配这个变量应用会拒绝启动——有意的 fail-closed。
    bootstrap-admin-password: ${ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-bob-password: ${ANTFLOW_BOOTSTRAP_BOB_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:devsecret0123456789devsecret0123456789devsecret}
  audit:
    archive-access-key: ${AUDIT_ARCHIVE_ACCESS_KEY:${MINIO_ACCESS_KEY:minioadmin}}
    archive-secret-key: ${AUDIT_ARCHIVE_SECRET_KEY:${MINIO_SECRET_KEY:minioadmin}}
    archive-encryption-secret: ${AUDIT_ARCHIVE_ENCRYPTION_SECRET:antflow-dev-audit-archive-key-change-me}
  mobile:
    files:
      minio:
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
  wecom:
    encryption-key: ${ANTFLOW_INTEGRATION_ENCRYPTION_KEY:antflow-dev-integration-key-change-me}
