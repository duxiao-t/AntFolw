spring:
  application:
    name: antflow-backend
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 136MB
  datasource:
    # Default: local PostgreSQL on 5432 (user-supplied postgres/Tao@1234).
    # Override via env: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    # stringtype=unspecified: 让 PG 把 JacksonTypeHandler 写出的字符串隐式转为 jsonb，
    # 否则 schema/settings/data/process 等 jsonb 列写入报 "column is of type jsonb but
    # expression is of type character varying"。自定义 SPRING_DATASOURCE_URL 时需自行带上此参数。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/antflow?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Tao@1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: always
antflow:
  jwt:
    secret: ${JWT_SECRET:devsecret0123456789devsecret0123456789devsecret}
    ttl-seconds: 86400
    clock-skew-seconds: 30
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
  login:
    per-minute: 5
    per-hour: 30
  auth:
    session-ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:2592000}
  audit:
    trusted-proxies: ${AUDIT_TRUSTED_PROXIES:}
    online-retention-days: ${AUDIT_ONLINE_RETENTION_DAYS:365}
    archive-cron: ${AUDIT_ARCHIVE_CRON:0 20 2 * * *}
    archive-endpoint: ${AUDIT_ARCHIVE_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    archive-access-key: ${AUDIT_ARCHIVE_ACCESS_KEY:${MINIO_ACCESS_KEY:minioadmin}}
    archive-secret-key: ${AUDIT_ARCHIVE_SECRET_KEY:${MINIO_SECRET_KEY:minioadmin}}
    archive-bucket: ${AUDIT_ARCHIVE_BUCKET:antflow-audit-archives}
    archive-region: ${AUDIT_ARCHIVE_REGION:}
    archive-create-bucket: ${AUDIT_ARCHIVE_CREATE_BUCKET:true}
    archive-encryption-secret: ${AUDIT_ARCHIVE_ENCRYPTION_SECRET:antflow-dev-audit-archive-key-change-me}
    archive-key-id: ${AUDIT_ARCHIVE_KEY_ID:local-dev-v1}
  mobile:
    files:
      storage: ${MOBILE_FILE_STORAGE:minio}
      max-bytes: ${MOBILE_FILE_MAX_BYTES:104857600}
      max-video-bytes: ${MOBILE_FILE_MAX_VIDEO_BYTES:104857600}
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${MINIO_BUCKET:antflow-mobile-files}
        region: ${MINIO_REGION:}
        create-bucket: ${MINIO_CREATE_BUCKET:true}
  media:
    ffmpeg-bin: ${FFMPEG_BIN:ffmpeg}
    watermark-font: ${WATERMARK_FONT:}
  automation:
    zone-id: ${ANTFLOW_TIME_ZONE:Asia/Shanghai}
    allowed-hosts: ${ANTFLOW_WEBHOOK_ALLOWED_HOSTS:}
    https-only: ${ANTFLOW_WEBHOOK_HTTPS_ONLY:false}
    allow-private-addresses: ${ANTFLOW_WEBHOOK_ALLOW_PRIVATE:false}
    connect-timeout: 3s
    request-timeout: 10s
    stale-lock-timeout: 2m
    max-attempts: 8
    poll-interval-ms: ${ANTFLOW_JOB_POLL_INTERVAL_MS:1000}
    recovery-interval-ms: ${ANTFLOW_JOB_RECOVERY_INTERVAL_MS:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
  type-handlers-package: com.antflow.common
springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.antflow: DEBUG
