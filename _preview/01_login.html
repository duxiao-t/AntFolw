<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>01 · 登录</title>
<link rel="stylesheet" href="preview.css" />
</head>
<body>

<button class="theme-toggle" aria-label="切换主题">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="preview-shell">
  <div class="preview-shell__title">01 · Login</div>
  <div class="preview-shell__hint">品牌渐变 hero · 表单卡片 · 图标严格居中</div>

  <div class="phone">
    <div class="phone__body">

      <section class="login">
        <div class="login__hero">
          <p class="login__eyebrow">ANTFLOW</p>
          <h1 class="login__title">Hello!</h1>
          <p class="login__subtitle">欢迎使用移动审批工作台</p>
          <div class="login__art" aria-hidden="true"></div>
        </div>

        <form class="login__panel" onsubmit="event.preventDefault();">
          <div class="login__field">
            <label for="li-u">用户名</label>
            <div class="login__field__box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
              <input id="li-u" placeholder="请输入账号" autocomplete="username" />
            </div>
          </div>
          <div class="login__field">
            <label for="li-p">密码</label>
            <div class="login__field__box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="li-p" type="password" placeholder="请输入密码" autocomplete="current-password" />
            </div>
          </div>
          <div class="login__row">
            <label><input type="checkbox" checked /> 记住我</label>
            <a href="#">忘记密码</a>
          </div>
          <div class="login__error" role="alert">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>
            <span>账号或密码错误</span>
          </div>
          <button class="btn btn--primary btn--block btn--lg" type="submit">登录</button>
        </form>

        <div class="login__third">
          <span>第三方登录</span>
          <div class="login__socials">
            <button class="login__social" aria-label="企业微信">
              <svg viewBox="0 0 24 24" fill="#1aad19"><path d="M8.5 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm7 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M3 13.5C3 9 7 6 12 6s9 3 9 7.5c0 4-3.5 7-8 7l-2-.3-3 1.5.8-2.6C5 18 3 16 3 13.5Z"/></svg>
            </button>
            <button class="login__social" aria-label="钉钉">
              <svg viewBox="0 0 24 24" fill="#1989fa"><path d="M4 6h12v8H8l-2 3v-3H4V6Zm14 2h2v6l-2 .5v2.5l-1.5-2H14V8h4Z"/></svg>
            </button>
          </div>
        </div>

        <p class="login__agreement">登录即代表你已阅读并同意 <a href="#">用户协议</a> 与 <a href="#">隐私政策</a></p>
      </section>

    </div>
  </div>
</div>

<script src="preview.js"></script>
</body>
</html>
