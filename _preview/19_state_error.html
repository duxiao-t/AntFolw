<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>19 · 错误态</title>
<link rel="stylesheet" href="preview.css" />
</head>
<body>

<button class="theme-toggle" aria-label="切换主题">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="preview-shell">
  <div class="preview-shell__title">19 · Error State</div>
  <div class="preview-shell__hint">网络/业务错误 · 空状态可用于通用错误</div>

  <div class="phone">
    <div class="phone__body">

      <header class="app-bar">
        <span></span>
        <div class="app-bar__title">待办</div>
        <button class="app-bar__action" aria-label="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </header>

      <main class="page page--no-tabbar">

        <section style="text-align:center;padding:18px 0 12px;">
          <h3 style="margin:0;font-size:22px;font-weight:800;">待我处理</h3>
          <small style="color:var(--af-color-muted);">数据加载失败</small>
        </section>

        <div class="empty-hero" style="margin-top:18px;">
          <div class="empty-hero__art">
            <svg viewBox="0 0 160 160" fill="none">
              <circle cx="80" cy="80" r="56" fill="#fdecea"/>
              <path d="M56 64h48M56 80h36M56 96h28" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
              <circle cx="120" cy="48" r="16" fill="#c0392b"/>
              <path d="M114 42l12 12M126 42l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              <path d="M48 122l16 16M64 122l-16 16" stroke="#fdecea" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <h3>数据加载失败</h3>
          <p>请检查网络连接,或在 Wi-Fi / 蜂窝数据切换后再次尝试。</p>
          <div class="empty-hero__cta">
            <button class="btn btn--primary btn--block btn--lg">重新加载</button>
            <button class="link" style="text-align:center;">查看网络诊断 ›</button>
          </div>
        </div>

        <div class="spacer-24"></div>

      </main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tabbar__item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
          工作台
        </button>
        <button class="tabbar__item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12M4 12h16M4 17h10"/></svg>
          待办
        </button>
        <button class="tabbar__item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          我的
        </button>
      </nav>

    </div>
  </div>
</div>

<script src="preview.js"></script>
</body>
</html>
