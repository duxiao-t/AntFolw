name: antflow-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: antflow
      POSTGRES_USER: antflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antflow -d antflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: backend
    environment:
      SPRING_PROFILES_ACTIVE: prod,test-isolated
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antflow?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: antflow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # 隔离测试环境给默认值：写成必填的话，已有的 .env.test 会让整份 compose 解析失败，
      # 连 `compose down`/refresh/destroy 都跑不了 → 旧测试环境没法清理也没法升级。
      # （compose.yaml 那份保持必填：真实部署必须在启动时就挡住。）
      ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${ANTFLOW_BOOTSTRAP_ADMIN_PASSWORD:-antflow-test-bootstrap}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: antflow-test-mobile-files
      MINIO_CREATE_BUCKET: "true"
      AUDIT_ARCHIVE_ENDPOINT: http://minio:9000
      AUDIT_ARCHIVE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AUDIT_ARCHIVE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      AUDIT_ARCHIVE_BUCKET: antflow-test-audit-archives
      AUDIT_ARCHIVE_CREATE_BUCKET: "true"
      AUDIT_ARCHIVE_ENCRYPTION_SECRET: ${AUDIT_ARCHIVE_ENCRYPTION_SECRET:?set AUDIT_ARCHIVE_ENCRYPTION_SECRET}
      AUDIT_ARCHIVE_KEY_ID: test-isolated-v1
      ANTFLOW_INTEGRATION_ENCRYPTION_KEY: ${ANTFLOW_INTEGRATION_ENCRYPTION_KEY:?set ANTFLOW_INTEGRATION_ENCRYPTION_KEY}
      ANTFLOW_AUTH_COOKIE_PREFIX: antflow-test
      # 隔离栈的对外地址。原来写死了 10.0.0.250（那台机器上的 host-only IP），换台机器
      # 端口就绑不上、整套栈起不来。改成变量，默认回环；需要别的地址就 ANTFLOW_TEST_HOST。
      ANTFLOW_PUBLIC_BASE_URL: http://${ANTFLOW_TEST_HOST:-127.0.0.1}:17070
      CORS_ALLOWED_ORIGIN_PATTERNS: http://${ANTFLOW_TEST_HOST:-127.0.0.1}:17070
      ANTFLOW_OIDC_ALLOWED_HOSTS: ""
      ANTFLOW_OIDC_HTTPS_ONLY: "false"
      ANTFLOW_WECOM_BASE_URL: http://127.0.0.1:9
      ANTFLOW_WEBHOOK_ALLOWED_HOSTS: ""
      ANTFLOW_WEBHOOK_HTTPS_ONLY: "true"
      ANTFLOW_WEBHOOK_ALLOW_PRIVATE: "false"
      BACKUP_DIRECTORY: /backups
      BACKUP_ENCRYPTION_SECRET: ${BACKUP_ENCRYPTION_SECRET:?set BACKUP_ENCRYPTION_SECRET}
      ANTFLOW_TIME_ZONE: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backup_data:/backups

  web:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: web
    ports:
      - "${ANTFLOW_TEST_HOST:-127.0.0.1}:17070:80"
    depends_on:
      - backend
    networks:
      - default
      - edge

networks:
  default:
    internal: true
  edge:

volumes:
  postgres_data:
    name: antflow-test_postgres_data
  minio_data:
    name: antflow-test_minio_data
  backup_data:
    name: antflow-test_backup_data
